name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on any tag starting with v (e.g., v1.0.0)
  workflow_dispatch: 
jobs:
  release:
    name: Build Artifacts and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission required to create a release and upload assets

    steps:
      # 1. Check out the source code with full history for Cleanroom versioning
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      # 2. Setup Java 25 Environment (Required for Cleanroom)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      # 3. Setup and cache Gradle using the official Gradle Action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Execute the Gradle Build
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Automatically generate a GitHub Release and upload build assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar
