name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on any tag starting with v (e.g., v1.0.0)
  workflow_dispatch: 
jobs:
  release:
    name: Build Artifacts and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission required to create a release and upload assets

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Environment
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # 3. Setup and cache Gradle using the official Gradle Action
      - name: Build with Gradle
      # You may pin to the exact commit or the version.
        #uses: gradle/actions@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 4. Execute the Gradle Build (compiles code, runs tests, packs JAR/WAR)
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Automatically generate a GitHub Release and upload build assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true # Automatically generates a changelog from your commit history
          files: |
            build/libs/*.jar
