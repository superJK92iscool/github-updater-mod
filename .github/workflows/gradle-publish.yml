name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on any tag starting with v (e.g., v1.0.0)
  workflow_dispatch: 
jobs:
  release:
    name: Build Artifacts and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial permission required to create a release and upload assets

    steps:
      # 1. Check out the source code with full history for Cleanroom versioning
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          
      # 2. Setup Java 25 Environment (Required for Cleanroom)
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Locate Gradle wrapper
        id: gradle
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -f "${WORKING_DIRECTORY}/gradlew" ]; then
            echo "dir=${WORKING_DIRECTORY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t wrappers < <(find . -maxdepth 2 -type f -name gradlew ! -path './.git/*' | sort)
          if [ "${#wrappers[@]}" -eq 1 ]; then
            echo "dir=$(dirname "${wrappers[0]}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Gradle wrapper not found in '${WORKING_DIRECTORY}', and no unique wrapper within two directory levels."
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          cache-provider: ${{ inputs.cache-provider }}
          build-scan-publish: ${{ inputs.build-scan-publish }}
          build-scan-terms-of-use-url: ${{ inputs.build-scan-publish && 'https://gradle.com/help/legal-terms-of-use' || '' }}
          build-scan-terms-of-use-agree: ${{ inputs.build-scan-publish && 'yes' || '' }}

      # 4. Execute the Gradle Build
      - name: Build with Gradle
        run: ./gradlew build

      # 5. Automatically generate a GitHub Release and upload build assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*.jar
