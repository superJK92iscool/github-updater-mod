pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.cleanroommc.com' }
    }
}

plugins {
    id 'com.cleanroommc.cleanroomgradle.settings' version '0.17.8'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'github-updater'
